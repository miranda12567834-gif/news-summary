name: Daily Summary
on:
  schedule:
    - cron: '0 22 * * *' # 06:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: 'check免费检查；preview付费生成预览；send生成并发邮件'
        type: choice
        options: [check, preview, send]
        default: check
permissions:
  contents: read
concurrency:
  group: daily-summary
  cancel-in-progress: false
jobs:
  summarize:
    if: github.event_name == 'workflow_dispatch' || (vars.DIGEST_ENABLED == 'true' && vars.QUALITY_APPROVED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      NEWS_SUMMARY_STATE: ./state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: news-summary-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-summary-state-
      - run: cp sources.interest.yaml sources.yaml
      - name: Check sources without AI or email
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: python -m src.runner --check
      - name: Generate preview without delivery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          OUTPUT_MODE: markdown
        run: |
          python -m src.runner --preview
          mkdir -p digest-preview
          cp "summaries/$(date +%F).md" digest-preview/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        with:
          name: digest-preview
          path: digest-preview/*.md
          if-no-files-found: error
          retention-days: 3
      - name: Generate and send
        if: (github.event_name == 'schedule' || inputs.mode == 'send') && vars.QUALITY_APPROVED == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.qq.com' }}
          OUTPUT_MODE: markdown
        run: python -m src.runner
      - name: Save state after successful delivery
        if: success() && vars.QUALITY_APPROVED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send')
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: news-summary-state-${{ github.run_id }}-${{ github.run_attempt }}
